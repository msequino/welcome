<link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/img/favicons/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

<script>
    const randomOkMessages = [
        "Great! Your message has been sent.",
        "Thanks for reaching out! We'll get back to you soon.",
        "Your message was successfully sent. We appreciate your feedback!",
        "Awesome! Your message is on its way to us.",
        "Thank you! We've received your message and will respond shortly."
    ];

    const formSpreeEndpoint = "https://formspree.io/f/";
    const formSpreeId = "mdajlgpy";
    
    function getRandomMessage() {
        const randomIndex = Math.floor(Math.random() * randomOkMessages.length);
        return randomOkMessages[randomIndex];
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Do something
        const el = document.getElementById('my-form');
        if(el) {
            const termsBox = document.getElementById('terms-box').style.display = "none";
            el.addEventListener('submit', function(event) {
                event.preventDefault(); // prevent default form submission
                const termsCheckbox = document.getElementById('terms');
                if (termsCheckbox && termsCheckbox.checked) {
                
                    var xhr = new XMLHttpRequest();
                    xhr.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            const randomMessage = getRandomMessage();
                            // alert(randomMessage);
                            document.getElementById("my-form").innerHTML = '';
                            document.getElementById("data-fs-success").innerHTML = '<p>' + randomMessage + '</p>';
                        }
                    };
                    xhr.open("POST", formSpreeEndpoint + formSpreeId); 
                    var formData = new FormData(document.getElementById("my-form")); 
                    xhr.send(formData);
                    return false; // prevent default form submission
                } else {
                    const randomMessage = getRandomMessage();
                    document.getElementById("my-form").innerHTML = '';
                    document.getElementById("data-fs-success").innerHTML = '<p>' + randomMessage + '</p>';
                }

            });
        }

        const navToggle = document.querySelector('.nav-toggle');
        const navMenu = document.getElementById('nav-menu');

        if (navToggle && navMenu) {
            navToggle.addEventListener('click', function () {
                const expanded = this.getAttribute('aria-expanded') === 'true';
                this.setAttribute('aria-expanded', String(!expanded));
                navMenu.classList.toggle('open');
            });

            navMenu.querySelectorAll('.nav-link').forEach(function (link) {
                link.addEventListener('click', function () {
                    navToggle.setAttribute('aria-expanded', 'false');
                    navMenu.classList.remove('open');
                });
            });
        }

    });
</script>
