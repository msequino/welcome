---
layout: default
---

<article class="project-detail">
    <header class="project-header">
        <h1 class="project-title">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p class="project-subtitle">{{ page.subtitle }}</p>
        {% endif %}
    </header>

    {% if page.tech %}
    <div class="project-tech">
        <strong>Tech Stack:</strong>
        {% for tech in page.tech %}
        <span class="tech-badge">{{ tech }}</span>
        {% endfor %}
    </div>
    {% endif %}

    <div class="project-content">
        {{ content }}
    </div>

    {% if page.link %}
    <div class="project-links">
        <a href="{{ page.link }}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">View Project</a>
    </div>
    {% endif %}
</article>

<nav class="project-nav">
    <a href="{{ '/projects' | relative_url }}" class="back-link">← Back to Projects</a>
</nav>
