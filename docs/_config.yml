# Jekyll Configuration

title: Software Engineer
description: Curious engineer focused on scalable architectures, streaming data pipelines, distributed systems, game development and Raspberry Pi tinkering.
author: Manuel Sequino
email: "mansequino@gmail.com"
url: "https://msequino.github.io"
baseurl: "/"
source: docs

# Build settings
markdown: kramdown
remote_theme: pages-themes/dinky@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme 

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from processing
exclude:
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock

# SCSS compilation
sass:
  sass_dir: _sass
  style: compressed
